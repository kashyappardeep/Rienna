<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=/?page=product-details">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <script>
    (function () {
      var params = window.location.search || ''
      window.location.replace('/?page=product-details' + (params ? '&' + params.slice(1) : ''))
    })()
  </script>
</head>
<body></body>
</html>
